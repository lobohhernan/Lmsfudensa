name: Deploy to Production

on:
  workflow_run:
    workflows: [Tests & Quality]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  deployments: write

concurrency:
  group: deployment-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://lmsfudensa.pages.dev
    
    if: github.event.workflow_run.conclusion == 'success'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci --prefer-offline

      - name: Build for production
        working-directory: ./frontend
        run: npm run build
        env:
          VITE_ENV: production

      - name: Create deployment
        uses: chrnorm/deployment-action@v2
        id: deployment
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          environment: production
          environment-url: https://lmsfudensa.pages.dev
          auto-merge: false

      - name: 📤 Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: lmsfudensa-production
          directory: frontend/dist
          branch: main

      - name: Update deployment status
        uses: chrnorm/deployment-status@v2
        if: success()
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          state: success
          deployment-id: ${{ steps.deployment.outputs.deployment_id }}
          environment-url: https://lmsfudensa.pages.dev

      - name: Update deployment status (failed)
        uses: chrnorm/deployment-status@v2
        if: failure()
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          state: failure
          deployment-id: ${{ steps.deployment.outputs.deployment_id }}

  health-check-production:
    name: Health Check
    runs-on: ubuntu-latest
    needs: [deploy-production]
    timeout-minutes: 10

    steps:
      - name: Verify production is healthy
        run: |
          for i in {1..10}; do
            echo "Health check attempt $i/10..."
            if curl -f https://lmsfudensa.pages.dev 2>/dev/null | grep -q "<!DOCTYPE"; then
              echo "✅ Production is healthy"
              exit 0
            fi
            sleep 10
          done
          echo "⚠️  Health check timeout (may still be deploying)"
          exit 0

  notify-deployment:
    name: Notify Deployment
    runs-on: ubuntu-latest
    needs: [deploy-production, health-check-production]
    if: always()

    steps:
      - name: 🎉 Deployment Complete
        run: |
          echo "## 🚀 Production Deployment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit**: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Branch**: \`${{ github.ref }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Author**: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ needs.deploy-production.result }}" = "success" ]; then
            echo "✅ **Deployed**: https://lmsfudensa.pages.dev" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ needs.health-check-production.result }}" = "success" ]; then
            echo "✅ **Status**: Healthy" >> $GITHUB_STEP_SUMMARY
          fi
