name: Code Quality & Linting

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-format:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'
      
      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci
      
      - name: TypeScript Type Check
        working-directory: ./frontend
        run: npx tsc --noEmit
        continue-on-error: true
      
      - name: Check formatting
        working-directory: ./frontend
        run: |
          # Check if prettier is available
          if npm list prettier > /dev/null 2>&1; then
            npx prettier --check "src/**/*.ts" "src/**/*.tsx"
          else
            echo "Prettier not installed, skipping format check"
          fi
        continue-on-error: true

  dependency-check:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'
      
      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci
      
      - name: Check for vulnerabilities
        working-directory: ./frontend
        run: npm audit --audit-level=moderate
        continue-on-error: true
      
      - name: Check for outdated packages
        working-directory: ./frontend
        run: npm outdated
        continue-on-error: true

  coverage-check:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'
      
      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci
      
      - name: Generate coverage report
        working-directory: ./frontend
        run: npm run test:coverage
        continue-on-error: true
      
      - name: Comment PR with coverage
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const coveragePath = './frontend/coverage/coverage-final.json';
            
            if (fs.existsSync(coveragePath)) {
              const coverage = JSON.parse(fs.readFileSync(coveragePath, 'utf8'));
              
              // Extract summary if available
              const summary = coverage.total || {};
              
              const comment = `## 📊 Test Coverage Report
              
              | Metric | Coverage |
              |--------|----------|
              | Statements | ${summary.statements?.pct || 'N/A'}% |
              | Branches | ${summary.branches?.pct || 'N/A'}% |
              | Functions | ${summary.functions?.pct || 'N/A'}% |
              | Lines | ${summary.lines?.pct || 'N/A'}% |
              
              Full report: [View Details](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})`;
              
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            }
