name: Tests & Quality

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'
      
      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci --prefer-offline
      
      - name: Run tests with coverage
        working-directory: ./frontend
        run: npm run test:coverage
        timeout-minutes: 15
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./frontend/coverage/coverage-final.json
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  e2e-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'
      
      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci --prefer-offline
      
      - name: Install Playwright browsers
        working-directory: ./frontend
        run: npx playwright install --with-deps
      
      - name: Run E2E tests
        working-directory: ./frontend
        run: npm run e2e --timeout=30000
        continue-on-error: true
      
      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ github.run_id }}
          path: ./frontend/playwright-report/
          retention-days: 7

  security-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'
      
      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci --prefer-offline
      
      - name: Check for vulnerabilities
        working-directory: ./frontend
        run: npm audit --audit-level=moderate
        continue-on-error: true
      
      - name: Check for outdated packages
        working-directory: ./frontend
        run: npm outdated
        continue-on-error: true

  code-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'
      
      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci --prefer-offline
      
      - name: TypeScript type check
        working-directory: ./frontend
        run: npx tsc --noEmit
        continue-on-error: true

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [unit-tests, security-checks]
    if: success()
    
    outputs:
      build-sha: ${{ steps.build-sha.outputs.sha }}
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'
      
      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci --prefer-offline
      
      - name: Build frontend
        working-directory: ./frontend
        run: npm run build
      
      - name: Generate build SHA
        id: build-sha
        run: echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
      
      - name: Verify build output
        run: |
          if [ -d "frontend/dist" ] && [ "$(ls -A frontend/dist)" ]; then
            echo "✅ Build successful - dist folder contains files"
            ls -lh frontend/dist | head -20
          else
            echo "❌ Build failed - dist folder is empty or missing"
            exit 1
          fi
      
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build-${{ github.run_id }}
          path: ./frontend/dist/
          retention-days: 5

  test-summary:
    runs-on: ubuntu-latest
    needs: [unit-tests, e2e-tests, build, security-checks, code-quality]
    if: always()
    
    steps:
      - name: 📊 Test Report Summary
        run: |
          echo "## 📊 CI/CD Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Stage | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ needs.unit-tests.result }}" = "success" ]; then
            echo "| ✅ Unit Tests | PASSED |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| ❌ Unit Tests | FAILED |" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ needs.e2e-tests.result }}" = "success" ]; then
            echo "| ✅ E2E Tests | PASSED |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| ⚠️  E2E Tests | ${{ needs.e2e-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ needs.build.result }}" = "success" ]; then
            echo "| ✅ Build | PASSED |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| ❌ Build | FAILED |" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ needs.security-checks.result }}" = "success" ]; then
            echo "| ✅ Security | PASSED |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| ⚠️  Security | ${{ needs.security-checks.result }} |" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ needs.code-quality.result }}" = "success" ]; then
            echo "| ✅ Quality | PASSED |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| ⚠️  Quality | ${{ needs.code-quality.result }} |" >> $GITHUB_STEP_SUMMARY
          fi
      - name: Build Status
        run: |
          if [ "${{ needs.build.result }}" = "success" ]; then
            echo "✅ Build: PASSED"
          else
            echo "❌ Build: FAILED"
          fi
